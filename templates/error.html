{% extends "base.html" %}

{% block title %}Error {{ error_code }}{% endblock %}
{% block page_title %}System Notification{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-6 col-md-8 text-center">
        <div class="card shadow-sm p-4">
            <div class="card-body">
                <div class="stat-icon-wrapper {% if error_code == 404 %}stat-icon-warning{% else %}stat-icon-danger{% endif %} mx-auto mb-3" style="width: 64px; height: 64px; font-size: 1.75rem;">
                    {% if error_code == 404 %}
                        <i class="bi bi-question-circle"></i>
                    {% else %}
                        <i class="bi bi-exclamation-octagon"></i>
                    {% endif %}
                </div>
                <h1 class="h3 fw-bold mb-2">{{ title }}</h1>
                <p class="text-muted mb-4">{{ message }}</p>
                
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                        <i class="bi bi-house-door me-1"></i> Return to Dashboard
                    </a>
                    <button type="button" class="btn btn-outline-secondary" onclick="window.history.back();">
                        <i class="bi bi-arrow-left me-1"></i> Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
